[project]
name = "dw-dl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ester", email = "ester@nilsen.no" }
]
requires-python = ">=3.14"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[project.scripts]
dw-dl = "dw_dl:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
